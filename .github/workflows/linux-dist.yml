name: Linux dist

# Builds the Linux deployment tarball (cctl + cloud-hypervisor + virtiofsd +
# guest kernel + initfs.ext4) natively for x86_64 and aarch64, smoke-tests it
# on hosts with KVM, and attaches the tarballs to a GitHub release on v* tags.
# See docs/linux-dist.md.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VIRTIOFSD_VERSION: v1.13.3

jobs:
  swift-version:
    name: Determine Swift version
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout .swift-version
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6
        with:
          sparse-checkout: .swift-version
          sparse-checkout-cone-mode: false

      - name: Read Swift version
        id: version
        run: echo "image=swift:$(cat .swift-version)-noble" >> "$GITHUB_OUTPUT"

  virtiofsd:
    name: virtiofsd (${{ matrix.arch }})
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # Built on 22.04 so the binary only requires glibc >= 2.35.
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6
        with:
          sparse-checkout: scripts/patches
          sparse-checkout-cone-mode: false

      - name: Restore cached virtiofsd
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: out/virtiofsd
          key: virtiofsd-${{ env.VIRTIOFSD_VERSION }}-${{ matrix.runner }}-${{ hashFiles('scripts/patches/virtiofsd-*.patch') }}

      - name: Build virtiofsd
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev libseccomp-dev
          if ! command -v cargo >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi
          git clone --depth 1 --branch "${VIRTIOFSD_VERSION}" https://gitlab.com/virtio-fs/virtiofsd src
          git -C src apply "$PWD/scripts/patches/virtiofsd-skip-cap-drop-with-sandbox-none.patch"
          cargo build --release --manifest-path src/Cargo.toml
          mkdir -p out
          install -m 755 src/target/release/virtiofsd out/virtiofsd

      - name: Upload virtiofsd
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: virtiofsd-${{ matrix.arch }}
          path: out/virtiofsd
          if-no-files-found: error

  dist:
    name: Dist tarball (${{ matrix.arch }})
    needs: [swift-version, virtiofsd]
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ needs.swift-version.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl make git xz-utils e2fsprogs file
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Static Linux SDK
        run: make -C vminitd linux-sdk

      - name: Restore cached downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .local/dist-cache
          key: dist-cache-${{ matrix.arch }}-${{ hashFiles('scripts/build-dist-linux.sh') }}
          restore-keys: dist-cache-${{ matrix.arch }}-

      - name: Download virtiofsd
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: virtiofsd-${{ matrix.arch }}
          path: .local/virtiofsd-bin

      - name: Build dist tarball
        run: ./scripts/build-dist-linux.sh --virtiofsd .local/virtiofsd-bin/virtiofsd --out bin

      - name: Upload dist tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: dist-${{ matrix.arch }}
          path: |
            bin/containerization-*.tar.gz
            bin/containerization-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  smoke-test:
    name: Smoke test (${{ matrix.arch }})
    needs: dist
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download dist tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: dist-${{ matrix.arch }}

      - name: Verify and extract
        run: |
          sha256sum -c containerization-*.tar.gz.sha256
          tar -xzf containerization-*.tar.gz
          dir=$(find . -maxdepth 1 -type d -name 'containerization-*' | head -1)
          echo "DIST=$dir" >> "$GITHUB_ENV"
          file "$dir"/bin/* "$dir"/kernel/*
          "$dir"/bin/cloud-hypervisor --version
          "$dir"/bin/virtiofsd --version

      - name: Check for KVM
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::/dev/kvm unavailable on ${{ matrix.runner }}; skipping VM boot test"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Boot a container
        if: steps.kvm.outputs.available == 'true'
        working-directory: ${{ env.DIST }}
        run: |
          # cctl only forwards container stdio when attached to a TTY.
          script -qfec "sudo ./bin/cctl run \
            --kernel kernel/vmlinux-${{ matrix.arch }} \
            --initfs initfs.ext4 \
            --ch-binary bin/cloud-hypervisor \
            --virtiofsd-binary bin/virtiofsd \
            -i docker.io/library/alpine:3.22 \
            --id smoke --no-network \
            /bin/echo dist-smoke-ok" "$RUNNER_TEMP/smoke.log"
          # The script(1) header echoes the command, so anchor the match.
          grep -q '^dist-smoke-ok' "$RUNNER_TEMP/smoke.log"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download dist tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            containerization-*.tar.gz
            containerization-*.tar.gz.sha256
          generate_release_notes: true
